<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixOS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2>MatrixOS</h2>
        <nav>
            <a href="#" class="active" data-page="dashboard">Dashboard</a>
            <a href="#" data-page="effects">Effects</a>
            <a href="#" data-page="studio">Pixel Studio</a>
            <a href="#" data-page="games">Games</a>
            <a href="#" data-page="settings">Settings</a>
        </nav>
    </div>
    
    <div class="main-content">
        <header>
            <div class="status-bar">
                <span id="conn-status" class="disconnected">Disconnected</span>
                <span id="fps-counter">FPS: 0</span>
            </div>
        </header>

        <main id="pages">
            <!-- Dashboard Page -->
            <section id="page-dashboard" class="page active">
                <h1>Dashboard</h1>
                <div class="cards">
                    <div class="card">
                        <h3>Current Effect</h3>
                        <h2 id="current-effect">Loading...</h2>
                    </div>
                    <div class="card">
                        <h3>Brightness</h3>
                        <input type="range" id="brightness-slider" min="0" max="255" value="64">
                    </div>
                    <div class="card">
                        <h3>System Health</h3>
                        <p>Heap: <span id="heap-free">0</span> bytes</p>
                        <p>PSRAM: <span id="psram-free">0</span> bytes</p>
                    </div>
                </div>
            </section>
            
            <!-- Effects Page -->
            <section id="page-effects" class="page">
                <h1>Effects</h1>
                <div id="effects-grid" class="effects-grid">
                    <!-- Populated by JS -->
                </div>
            </section>
            
            <!-- Other pages placeholder -->
            <section id="page-studio" class="page">
                <h1>Pixel Studio</h1>
                <p>Drawing tools coming soon.</p>
            </section>
        </main>
    </div>

    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
